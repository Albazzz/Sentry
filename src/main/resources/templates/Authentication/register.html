<!DOCTYPE html>
<html lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Đăng Ký - Sentry</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/yeti.css}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/16327/MorphSVGPlugin.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/TweenMax.min.js"></script>
</head>
<body>
<div class="container active">
    <div class="toggle-box">
        <div class="toggle-panel toggle-left">
            <h1>Xin chào!</h1>
            <p>Chưa có tài khoản?</p>
            <a th:href="@{/signup}" class="btn register-btn">Đăng ký</a>
        </div>
        <div class="toggle-panel toggle-right">
            <div th:insert="~{yeti/yeti}"></div>
            <p>Đã có tài khoản?</p>
            <a th:href="@{/login}" class="btn login-btn">Đăng nhập</a>
        </div>
    </div>

    <!-- Form Đăng ký -->
    <div class="form-box register">
        <form id="registerForm">
            <h1>Đăng ký</h1>
            
            <!-- Full Name -->
            <div class="input-box">
                <input type="text" id="fullName" name="fullName" placeholder="Họ và tên" required>
                <i class='bx bxs-user'></i>
            </div>
            
            <!-- Email -->
            <div class="input-box">
                <input type="email" id="email" name="email" placeholder="Email" required>
                <i class='bx bxs-envelope'></i>
            </div>
            
            <!-- Password -->
            <div class="input-box">
                <input type="password" id="password" name="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)" required minlength="6">
                <i class='bx bxs-lock-alt'></i>
            </div>
            
            <!-- Confirm Password -->
            <div class="input-box">
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Xác nhận mật khẩu" required>
                <i class='bx bxs-lock-alt'></i>
            </div>
            
            <!-- Gender -->
            <div class="input-box">
                <label for="gender" style="color: #e94f64; font-size: 14px; margin-bottom: 5px; display: block;">Giới tính:</label>
                <div class="custom-select-box">
                    <select id="gender" name="gender">
                        <option value="Khác">Chọn giới tính</option>
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                        <option value="Khác">Khác</option>
                    </select>
                </div>
            </div>
            
            <!-- Role Selection -->
            <div class="input-box">
                <label for="role" style="color: #e94f64; font-size: 14px; margin-bottom: 5px; display: block;">Bạn là:</label>
                <div class="custom-select-box">
                    <select id="role" name="role" required>
                        <option value="">-- Chọn vai trò --</option>
                        <option value="student">Học sinh</option>
                        <option value="teacher">Giáo viên</option>
                    </select>
                </div>
            </div>
            
            <!-- Certificate Upload (Only for Teachers) -->
            <div class="input-box" id="certificateBox" style="display: none;">
                <label for="certificate" style="color: #e94f64; font-size: 14px; margin-bottom: 5px; display: block;">
                    <i class='bx bxs-certification'></i> Chứng chỉ giảng dạy: <span style="color: #e94f64;">*</span>
                </label>
                <input type="file" name="certificate" id="certificate" accept=".pdf" style="width: 100%; padding: 10px; background: #f0f0f0; border-radius: 8px; border: none;">
                <small style="color: #666; font-size: 12px; display: block; margin-top: 5px;">
                    <i class='bx bx-info-circle'></i> Yêu cầu: File PDF, tối đa 10MB, chứng chỉ phải còn hiệu lực
                </small>
            </div>
            
            <!-- Japanese Level (Optional) -->
            <div class="input-box">
                <label for="japaneseLevel" style="color: #e94f64; font-size: 14px; margin-bottom: 5px; display: block;">Trình độ tiếng Nhật (tùy chọn):</label>
                <div class="custom-select-box">
                    <select id="japaneseLevel" name="japaneseLevel">
                        <option value="">Chọn trình độ</option>
                        <option value="N5">N5 - Sơ cấp</option>
                        <option value="N4">N4 - Tiền trung cấp</option>
                        <option value="N3">N3 - Trung cấp</option>
                        <option value="N2">N2 - Trung cao cấp</option>
                        <option value="N1">N1 - Cao cấp</option>
                    </select>
                </div>
            </div>
            
            <!-- Phone Number (Optional) -->
            <div class="input-box">
                <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Số điện thoại (không bắt buộc)">
                <i class='bx bxs-phone'></i>
            </div>

            <button type="submit" class="btn">Đăng ký</button>
            
            <!-- Hiển thị message -->
            <div id="message" style="margin-top: 15px;"></div>
            
            <p style="font-size: 14px; margin-top: 15px;">hoặc đăng ký với ứng dụng khác</p>
            <div class="social-icons">
                <a href="#"><i class='bx bxl-google'></i></a>
                <a href="#"><i class='bx bxl-facebook'></i></a>
                <a href="#"><i class='bx bxl-github'></i></a>
                <a href="#"><i class='bx bxl-linkedin'></i></a>
            </div>
        </form>
        
        <!-- Form OTP Verification -->
        <form id="otpForm" style="display: none;">
            <h1>Xác minh Email</h1>
            <p style="font-size: 14px; margin-bottom: 20px; color: #666;">
                Vui lòng nhập mã OTP để xác thực Email: <strong id="otpEmailDisplay"></strong>
            </p>
            
            <div class="input-box">
                <input type="text" id="otpCode" name="otpCode" placeholder="Nhập mã OTP (6 số)" maxlength="6" required>
                <i class='bx bxs-lock-alt'></i>
            </div>
            
            <button type="submit" class="btn" id="verifyBtn">Xác thực</button>
            
            <div id="otpMessage" style="margin-top: 15px;"></div>
            
            <button type="button" id="resendOtpBtn" class="btn" style="margin-top: 10px; background: transparent; border: 2px solid #e94f64; color: #e94f64;">
                Gửi lại mã OTP
            </button>
            
            <div id="countdownTimer" style="margin-top: 10px; color: #666; font-size: 13px;"></div>
        </form>
    </div>
</div>

<script th:src="@{/js/register.js}"></script>
<!-- Animation và logic đã được xử lý trong register.js -->
</body>
</html>
