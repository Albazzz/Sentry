<html xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>

<div id="chatButton" onclick="toggleChat()">💬 Hỗ trợ thông tin</div>

<section id="chatContainer" th:fragment="chatBox">

    <div id="chatHeader">
        Chat với AI
        <button onclick="toggleChat()">✖</button>
    </div>

    <div id="chatBox">
        <div class="aiMessage">
            🎌 Xin chào! Tôi là trợ lý Wasabii. Hãy hỏi tôi về tiếng Nhật hoặc các khóa học nhé!
        </div>
    </div>

    <div id="suggestBox">
        <button onclick="sendSampleQuestion()">Gợi ý: Đồ ăn tiếng Nhật là gì?</button>
    </div>

    <div id="butt">
        <input type="text" id="userInput" placeholder="Nhập tin nhắn..."/>

        <button id="buttonChat" onclick="sendMessage()">Gửi</button>
    </div>

</section>

</body>
</html>
