<!DOCTYPE html>
<html lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.title}">Sentry - Debug Japanese</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
    <!-- Custom CSS files -->
    <link rel="stylesheet" th:href="@{/css/indexstyle.css}">
    <link rel="stylesheet" th:href="@{/css/stylechat.css}">
</head>
<body>
<div class="page-wrapper">
    <div th:insert="~{Home/nav :: nav}"></div>  <!-- Include nav.html, giả sử có fragment 'nav' -->
    <div th:insert="~{chatBoxjsp/chatBox :: chatBox}"></div>  <!-- Tương tự cho chatBox.html -->

    <section class="hero">
        <div class="container">
            <div class="hero-text">
                <h1 th:text="#{hero.title}">Học tiếng Nhật cùng Sentry</h1>
                <p th:text="#{hero.description}">Nền tảng học tiếng Nhật hiệu quả, tương tác, và dễ dàng.</p>
                <!-- Call-to-action buttons -->
                <a th:href="@{/CoursesServlet}" class="btn-primary" th:text="#{hero.startNow}">Bắt đầu ngay</a>
                <a th:href="@{/introduce}" class="btn-secondary" th:text="#{hero.learnMore}">Tìm hiểu thêm</a>  <!-- Giả sử introduce.jsp -> introduce.html -->
            </div>
            <!-- Hero image -->
            <div class="hero-image">
                <img th:src="@{/image/homepage.jpg}" th:alt="#{hero.imageAlt}" />
            </div>
        </div>
    </section>

    <section class="featured-courses">
        <div class="container">
            <h2 th:text="#{courses.featuredTitle}">Khóa học nổi bật</h2>
            <div class="course-grid">
                <div th:each="course : ${suggestedCourses}" class="course-card suggested">
                    <h4 th:text="${course.title}"></h4>  <!-- Title động từ DB Courses -->
                    <p th:text="${course.description}"></p>  <!-- Description động -->
                    <div class="course-meta text-muted" th:text="#{courses.suggestedLabel}">Khóa học đề xuất</div>
                    <a th:href="@{/CourseDetailServlet(id=${course.courseID})}" class="btn btn-outline-primary mt-2">
                        <i class="fa-solid fa-arrow-right"></i> <span th:text="#{courses.viewDetails}">Xem chi tiết</span>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <div th:insert="~{Home/footer :: footer}"></div>  <!-- Include footer.html -->
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
<script th:src="@{/Script/cherry-blossom.js}"></script>

<script th:src="@{/js/premium-check.js}"></script>
<script th:inline="javascript">
    $(document).ready(function () {
        // --- Khai báo biến ---
        const searchUrl = /*[[@{/searchCourse}]]*/ '/searchCourse';
        const detailUrlTemplate = /*[[@{/courseDetail(id=__ID__)}]]*/ '/courseDetail?id=__ID__';
        // Lưu lại $searchResults để dùng nhiều lần, tránh query DOM liên tục
        const $searchResults = $('#searchResults');
        const $searchInput = $('#searchCourseInput');

        // ===== 1. SỰ KIỆN "INPUT" (KHI GÕ CHỮ) =====
        // Chỉ khi người dùng thực sự gõ, chúng ta mới gọi AJAX
        $searchInput.on('input', function () {
            const query = $(this).val().trim();

            // Nếu người dùng xóa hết chữ, hãy dọn dẹp và ẩn đi
            if (query.length === 0) {
                $searchResults.empty().removeClass('show');
                return; // Dừng lại
            }

            // Đây là nơi duy nhất gọi AJAX
            $.ajax({
                url: searchUrl,
                type: 'GET',
                data: {query: query},
                dataType: 'json',
                success: function (data) {
                    // Luôn dọn dẹp kết quả cũ trước khi thêm mới
                    $searchResults.empty();
                    console.log('Raw search response:', data);

                    if (data && Array.isArray(data) && data.length > 0) {
                        const $ul = $('<ul>').addClass('list-group');
                        $.each(data, function (_, course) {
                            const courseTitle = course.title ? String(course.title) : /*[[#{course.noTitle}]]*/ 'Không có tiêu đề';
                            const courseDesc = course.description ? String(course.description) : /*[[#{course.noDescription}]]*/ 'Không có mô tả';
                            const courseId = course.courseID ? String(course.courseID) : '';
                            const finalDetailUrl = detailUrlTemplate.replace('__ID__', encodeURIComponent(courseId));

                            const $li = $('<li>').addClass('list-group-item')
                                .append($('<h5>').text(courseTitle))
                                .append($('<p>').text(courseDesc))
                                .append($('<a>')
                                    .addClass('btn btn-sm btn-wasabii')
                                    .attr('href', finalDetailUrl)
                                    .text(/*[[#{course.viewDetails}]]*/ 'Xem chi tiết'));
                            $ul.append($li);
                        });

                        if ($ul.children().length > 0) {
                            $searchResults.append($ul).addClass('show'); // Gắn và hiện
                        } else {
                            $searchResults.append('<div class="alert alert-info m-0">' + /*[[#{search.noResults}]]*/ 'Không tìm thấy khóa học nào.' + '</div>').addClass('show');
                        }
                    } else {
                        $searchResults.append('<div class="alert alert-info m-0">' + /*[[#{search.noResults}]]*/ 'Không tìm thấy khóa học nào.' + '</div>').addClass('show');
                    }
                    console.log('Rendered HTML:', $searchResults.html());
                },
                error: function (xhr, status, error) {
                    console.error('AJAX error:', status, error, xhr.responseText);
                    $searchResults.empty().append('<div class="alert alert-danger m-0">' + /*[[#{search.error}]]*/ 'Đã xảy ra lỗi khi tìm kiếm: ' + error + '</div>').addClass('show');
                }
            });
        });

        // ===== 2. SỰ KIỆN "FOCUS" (KHI BẤM VÀO) =====
        // Chỉ hiện lại kết quả nếu nó đã có nội dung và input không rỗng
        $searchInput.on('focus', function () {
            const query = $(this).val().trim();
            // Kiểm tra xem input có chữ VÀ hộp kết quả có nội dung không
            if (query.length > 0 && $searchResults.html().trim().length > 0) {
                // Nếu có, chỉ cần hiện nó lên, không gọi AJAX
                $searchResults.addClass('show');
            }
        });

        // ===== 3. SỰ KIỆN "CLICK" (BẤM RA NGOÀI) =====
        // Logic này dùng để ẩn hộp kết quả đi
        $(document).on('click', function (event) {
            const $target = $(event.target);
            // Nếu click không phải là ô input VÀ không phải là thứ gì bên trong kết quả
            if (!$target.is($searchInput) && !$target.closest($searchResults).length) {
                setTimeout(function() {
                    $searchResults.removeClass('show'); // Thì ẩn đi, với delay để tránh flash
                }, 0);
            }
        });
    });
</script>
</body>
</html>
